# xcodegen spec for the Nightjar shells. Two thin targets over ONE portable C++
# engine (../../engine), reached through NightjarEngine (Obj-C++):
#   • Nightjar    , iOS app  (device camera; Simulator falls back to synthetic)
#   • NightjarMac , macOS app (webcam), test the live guard on the Mac, no cable
#
# Regenerate + build:
#   xcodegen -s project.yml
#   xcodebuild -project Nightjar.xcodeproj -scheme NightjarMac -configuration Release build
#   xcodebuild -project Nightjar.xcodeproj -scheme Nightjar -sdk iphonesimulator -configuration Release build
name: Nightjar
options:
  bundleIdPrefix: dev.hungtruong
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    HEADER_SEARCH_PATHS:
      - $(SRCROOT)/../../engine/include
      - $(SRCROOT)/Sources
    SWIFT_OBJC_BRIDGING_HEADER: Sources/Nightjar-Bridging-Header.h
targets:
  Nightjar:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../engine/src
    info:
      path: Info-iOS.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Nightjar
        NSCameraUsageDescription: "Nightjar watches this camera entirely on-device. No frame ever leaves the phone."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hungtruong.nightjar
        CODE_SIGNING_ALLOWED: "NO"
  NightjarMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: ../../engine/src
      - path: ../../engine/vlm/mtmd_vlm_worker.cpp  # real SmolVLM Tier-2 (Mac only)
    info:
      path: Info-Mac.plist
      properties:
        CFBundleDisplayName: Nightjar
        NSCameraUsageDescription: "Nightjar watches this camera entirely on-device. No frame ever leaves the Mac."
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hungtruong.nightjar.mac
        # Local dev build: ad-hoc signed, no hardened runtime / sandbox, so the
        # webcam TCC prompt works when launched from the terminal.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: "NO"
        ENABLE_APP_SANDBOX: "NO"
        # Real Tier-2 VLM: link brew's llama.cpp / mtmd / ggml (Apple Silicon).
        GCC_PREPROCESSOR_DEFINITIONS: ["NIGHTJAR_HAS_VLM=1", "$(inherited)"]
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../../engine/include
          - $(SRCROOT)/../../engine/vlm
          - $(SRCROOT)/Sources
          - /opt/homebrew/opt/llama.cpp/include
          - /opt/homebrew/opt/ggml/include
        LIBRARY_SEARCH_PATHS:
          - /opt/homebrew/opt/llama.cpp/lib
          - /opt/homebrew/opt/ggml/lib
        OTHER_LDFLAGS: ["-lllama", "-lmtmd", "-lggml", "-lggml-base"]
        LD_RUNPATH_SEARCH_PATHS:
          - /opt/homebrew/lib
          - /opt/homebrew/opt/llama.cpp/lib
          - /opt/homebrew/opt/ggml/lib
